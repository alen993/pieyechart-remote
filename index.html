<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PiEyeChart Remote</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#6366f1">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #14141f;
  --surface2: #1e1e2e;
  --accent: #6366f1;
  --accent2: #818cf8;
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --radius: 10px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
  user-select: none;
  -webkit-user-select: none;
}

/* === Connection Bar === */
.conn-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--surface);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.logo { font-size: 16px; font-weight: 800; letter-spacing: -0.5px; }
.logo span { color: var(--accent2); }
.conn-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
.conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #333; }
.conn-dot.connected { background: var(--green); box-shadow: 0 0 6px var(--green); }
.conn-dot.connecting { background: var(--amber); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.4; } }
.conn-btn {
  padding: 6px 14px;
  background: var(--accent);
  border: none;
  border-radius: 20px;
  color: white;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}
.conn-btn.disconnect { background: var(--red); }

/* === Examiner Display === */
.exam-display {
  margin: 6px 10px;
  padding: 8px 12px;
  background: var(--surface2);
  border-radius: var(--radius);
  border: 1px solid rgba(255,255,255,0.06);
  text-align: center;
}
.exam-header { display: flex; justify-content: space-between; font-size: 11px; color: var(--text2); margin-bottom: 4px; }
.exam-letters { font-size: 22px; font-weight: 700; letter-spacing: 8px; padding: 4px 0; min-height: 32px; }
.exam-footer { display: flex; justify-content: space-between; font-size: 10px; color: var(--text2); margin-top: 2px; }

/* === Tabs === */
.tabs {
  display: flex;
  padding: 0 10px;
  gap: 2px;
  background: var(--surface);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.tab {
  flex: 1;
  padding: 8px 0;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text2);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.tab.active { color: var(--accent2); border-bottom-color: var(--accent); }

/* === Panels === */
.panel { display: none; padding: 6px 10px; }
.panel.active { display: block; }

.section-title {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text2);
  margin: 6px 0 4px;
}

/* === Button Grids === */
.btn-grid { display: grid; gap: 4px; }
.cols-2 { grid-template-columns: 1fr 1fr; }
.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
.cols-5 { grid-template-columns: 1fr 1fr 1fr 1fr 1fr; }

.cmd-btn {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6px 4px;
  min-height: 34px;
  background: var(--surface2);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.cmd-btn:active { transform: scale(0.95); background: var(--accent); }
.cmd-btn.yes { border-color: rgba(34,197,94,0.3); color: var(--green); }
.cmd-btn.no { border-color: rgba(239,68,68,0.3); color: var(--red); }
.cmd-btn.accent { background: var(--accent); }

/* === D-pad === */
.dpad-container { display: flex; justify-content: center; padding: 4px 0; }
.dpad {
  display: grid;
  grid-template-columns: 44px 44px 44px;
  grid-template-rows: 44px 44px 44px;
  gap: 3px;
}
.dpad .cmd-btn { min-height: 44px; font-size: 16px; border-radius: 8px; }
.dpad .center { background: var(--accent); font-size: 12px; font-weight: 800; border-radius: 50%; }
.empty { background: transparent; border: none; }

/* === Acuity Grid === */
.acuity-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}
.acuity-btn {
  position: relative;
  overflow: hidden;
  padding: 6px 2px;
  min-height: 34px;
  background: var(--surface2);
  border: 1px solid rgba(99,102,241,0.15);
  border-radius: 8px;
  color: var(--accent2);
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
}
.acuity-btn:active { transform: scale(0.95); background: var(--accent); color: white; }

/* === Toast === */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  padding: 10px 20px;
  background: rgba(30,30,50,0.95);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  color: var(--text);
  font-size: 13px;
  opacity: 0;
  transition: all 0.3s;
  z-index: 200;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* === Ripple === */
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  transform: scale(0);
  animation: ripple-anim 0.5s ease-out;
  pointer-events: none;
}
@keyframes ripple-anim { to { transform: scale(3); opacity: 0; } }

@media (orientation: landscape) {
  .panel { padding: 4px 12px; }
  .dpad { grid-template-columns: 40px 40px 40px; grid-template-rows: 40px 40px 40px; }
  .cmd-btn { padding: 4px 3px; min-height: 30px; }
}
</style>
</head>
<body>

<!-- Connection Bar -->
<div class="conn-bar">
  <div class="logo">Pi<span>Eye</span>Chart</div>
  <div class="conn-status">
    <div class="conn-dot" id="connDot"></div>
    <span id="connLabel">Disconnected</span>
  </div>
  <button class="conn-btn" id="connBtn" onclick="toggleConnection()">Connect</button>
</div>

<!-- Examiner Display -->
<div class="exam-display" id="examDisplay">
  <div class="exam-header">
    <span id="examTestName">---</span>
    <span id="examAcuity">---</span>
  </div>
  <div class="exam-letters">
    <span id="examLetters"><span style="color:var(--text2);font-size:13px;letter-spacing:3px;">Waiting for display...</span></span>
  </div>
  <div class="exam-footer">
    <span id="examMode">---</span>
    <span id="examRow">---</span>
  </div>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab active" data-panel="main">Main</button>
  <button class="tab" data-panel="tests">Tests</button>
  <button class="tab" data-panel="acuity">Acuity</button>
  <button class="tab" data-panel="settings">Settings</button>
</div>

<!-- ============ MAIN PANEL ============ -->
<div class="panel active" id="panel-main">
  <div class="btn-grid cols-2" style="margin-bottom:4px;">
    <button class="cmd-btn yes" data-cmd="OUI">&#10003; YES</button>
    <button class="cmd-btn no" data-cmd="NON">&#10007; NO</button>
  </div>

  <div class="dpad-container">
    <div class="dpad">
      <div class="empty"></div>
      <button class="cmd-btn" data-cmd="UP">&#9650;</button>
      <div class="empty"></div>
      <button class="cmd-btn" data-cmd="LEFT">&#9664;</button>
      <button class="cmd-btn center" data-cmd="CHG">CHG</button>
      <button class="cmd-btn" data-cmd="RIGHT">&#9654;</button>
      <div class="empty"></div>
      <button class="cmd-btn" data-cmd="DOWN">&#9660;</button>
      <div class="empty"></div>
    </div>
  </div>

  <div class="btn-grid cols-3" style="margin-bottom:4px;">
    <button class="cmd-btn" data-cmd="RV">R/G</button>
    <button class="cmd-btn" data-cmd="INV">B/W</button>
    <button class="cmd-btn accent" data-cmd="MNU">MENU</button>
  </div>

  <div class="section-title">Optotype</div>
  <div class="btn-grid cols-5">
    <button class="cmd-btn" data-cmd="OAL">Letters</button>
    <button class="cmd-btn" data-cmd="OCH">Numbers</button>
    <button class="cmd-btn" data-cmd="OSN">E</button>
    <button class="cmd-btn" data-cmd="OLN">C</button>
    <button class="cmd-btn" data-cmd="OIM">Child</button>
  </div>

  <div class="section-title">Layout</div>
  <div class="btn-grid cols-4">
    <button class="cmd-btn" data-cmd="MSN">Single</button>
    <button class="cmd-btn" data-cmd="MLN">Row</button>
    <button class="cmd-btn" data-cmd="M3L">3 Rows</button>
    <button class="cmd-btn" data-cmd="MCP">Column</button>
  </div>
</div>

<!-- ============ ACUITY PANEL ============ -->
<div class="panel" id="panel-acuity">
  <div class="section-title">Direct Acuity Jump</div>
  <div class="acuity-grid">
    <button class="acuity-btn" data-cmd="A005">0.05</button>
    <button class="acuity-btn" data-cmd="A010">0.1</button>
    <button class="acuity-btn" data-cmd="A020">0.2</button>
    <button class="acuity-btn" data-cmd="A025">0.25</button>
    <button class="acuity-btn" data-cmd="A030">0.3</button>
    <button class="acuity-btn" data-cmd="A040">0.4</button>
    <button class="acuity-btn" data-cmd="A050">0.5</button>
    <button class="acuity-btn" data-cmd="A070">0.7</button>
    <button class="acuity-btn" data-cmd="A080">0.8</button>
    <button class="acuity-btn" data-cmd="A100">1.0</button>
    <button class="acuity-btn" data-cmd="A120">1.2</button>
    <button class="acuity-btn" data-cmd="A200">2.0</button>
  </div>
</div>

<!-- ============ TESTS PANEL ============ -->
<div class="panel" id="panel-tests">
  <div class="section-title">Groups</div>
  <div class="btn-grid cols-4">
    <button class="cmd-btn" data-cmd="G1">G1</button>
    <button class="cmd-btn" data-cmd="G2">G2</button>
    <button class="cmd-btn" data-cmd="G3">G3</button>
    <button class="cmd-btn accent" data-cmd="TESTS">Tests</button>
  </div>

  <div class="section-title">Cylinder / Astigmatism</div>
  <div class="btn-grid cols-4">
    <button class="cmd-btn" data-cmd="XCL">XCYL</button>
    <button class="cmd-btn" data-cmd="CPT">ASTIG</button>
    <button class="cmd-btn" data-cmd="WOR">Worth</button>
    <button class="cmd-btn" data-cmd="SHN">SHO</button>
  </div>

  <div class="section-title">Special</div>
  <div class="btn-grid cols-4">
    <button class="cmd-btn" data-cmd="ISH">ISH</button>
    <button class="cmd-btn" data-cmd="PTX">FIX</button>
    <button class="cmd-btn" data-cmd="ACP3D">3D</button>
    <button class="cmd-btn" data-cmd="MOV">MOV</button>
  </div>

  <div class="btn-grid cols-3" style="margin-top:4px;">
    <button class="cmd-btn" data-cmd="IMG">EDU</button>
    <button class="cmd-btn" data-cmd="MEM">MEMO</button>
    <button class="cmd-btn accent" id="btnInfo" data-cmd="INFO">INFO</button>
  </div>
</div>

<!-- ============ SETTINGS PANEL ============ -->
<div class="panel" id="panel-settings">
  <div class="section-title">Connection Mode</div>
  <div class="btn-grid cols-2">
    <button class="cmd-btn accent" id="btnModeBLE" onclick="setMode('ble')">&#9889; Bluetooth</button>
    <button class="cmd-btn" id="btnModeWS" onclick="setMode('ws')">&#128246; WiFi</button>
  </div>

  <div class="section-title">WiFi Settings</div>
  <div style="display:flex;gap:6px;align-items:center;">
    <input type="text" id="wsHost" placeholder="192.168.x.x"
      style="flex:1;padding:10px;background:var(--surface2);border:1px solid rgba(255,255,255,0.1);
      border-radius:8px;color:var(--text);font-size:13px;outline:none;">
    <span style="color:var(--text2);font-size:12px;">:8070</span>
  </div>

  <div class="section-title">Software Update</div>
  <button class="cmd-btn" onclick="forceUpdate()" style="width:100%;padding:12px;font-size:14px;font-weight:700;background:var(--accent);border-radius:8px;">
    &#x1F504; Check for Update
  </button>
  <div id="updateStatus" style="font-size:11px;color:var(--text2);text-align:center;margin-top:4px;"></div>

  <div class="section-title">About</div>
  <div style="padding:12px;background:var(--surface2);border-radius:8px;border:1px solid rgba(255,255,255,0.06);">
    <div style="font-weight:700;font-size:13px;margin-bottom:4px;">PiEyeChart Remote</div>
    <div style="font-size:11px;color:var(--text2);line-height:1.5;">
      BLE &amp; WiFi remote control<br>
      Version 1.2
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
'use strict';

// === Config ===
const BLE_SERVICE_UUID    = 'b1e10001-0001-1000-8000-00805f9b34fb';
const BLE_CMD_CHAR_UUID   = 'b1e10001-0002-1000-8000-00805f9b34fb';
const BLE_STATUS_CHAR_UUID= 'b1e10001-0003-1000-8000-00805f9b34fb';
const BLE_AUTH_CHAR_UUID  = 'b1e10001-0004-1000-8000-00805f9b34fb';
const PAIRING_CODE = '12345';
const WS_PORT = 8070;

// === State ===
let mode = 'ble';
let bleDevice = null;
let bleServer = null;
let bleCmdChar = null;
let ws = null;
let connected = false;

// === UI ===
const connDot = document.getElementById('connDot');
const connLabel = document.getElementById('connLabel');
const connBtn = document.getElementById('connBtn');
const toastEl = document.getElementById('toast');

// === Tab switching ===
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
  });
});

// === Button clicks ===
document.querySelectorAll('[data-cmd]').forEach(btn => {
  btn.addEventListener('click', (e) => {
    sendCommand(btn.dataset.cmd);
    ripple(e, btn);
  });
});

// === Ripple ===
function ripple(e, el) {
  const r = document.createElement('span');
  r.className = 'ripple';
  const rect = el.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  r.style.width = r.style.height = size + 'px';
  r.style.left = (e.clientX || rect.left + rect.width/2) - rect.left - size/2 + 'px';
  r.style.top = (e.clientY || rect.top + rect.height/2) - rect.top - size/2 + 'px';
  el.appendChild(r);
  setTimeout(() => r.remove(), 500);
}

// === Toast ===
let toastTimer;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

// === Connection Status ===
function setConnStatus(status, label) {
  connDot.className = 'conn-dot ' + status;
  connLabel.textContent = label;
  connected = status === 'connected';
  connBtn.textContent = connected ? 'Disconnect' : 'Connect';
  connBtn.className = 'conn-btn' + (connected ? ' disconnect' : '');
}

// === Send Command ===
function sendCommand(cmd) {
  mode === 'ble' ? sendBLE(cmd) : sendWS(cmd);
}

// === BLE ===
async function connectBLE() {
  if (!navigator.bluetooth) { showToast('Bluetooth not available'); return; }
  try {
    setConnStatus('connecting', 'Scanning...');
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'PiEyeChart' }],
      optionalServices: [BLE_SERVICE_UUID]
    });
    bleDevice.addEventListener('gattserverdisconnected', () => {
      setConnStatus('', 'Disconnected');
      bleCmdChar = null;
      showToast('BLE disconnected');
    });
    setConnStatus('connecting', 'Connecting...');
    bleServer = await bleDevice.gatt.connect();
    const service = await bleServer.getPrimaryService(BLE_SERVICE_UUID);
    setConnStatus('connecting', 'Authenticating...');
    const authChar = await service.getCharacteristic(BLE_AUTH_CHAR_UUID);
    await authChar.writeValue(new TextEncoder().encode(PAIRING_CODE));
    bleCmdChar = await service.getCharacteristic(BLE_CMD_CHAR_UUID);
    setConnStatus('connected', 'BLE Connected');
    showToast('Connected via Bluetooth');
  } catch (err) {
    console.error('[BLE]', err);
    setConnStatus('', 'Disconnected');
    if (err.name !== 'NotFoundError') showToast('BLE error: ' + err.message);
  }
}

function disconnectBLE() {
  if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect();
  bleDevice = null; bleServer = null; bleCmdChar = null;
  setConnStatus('', 'Disconnected');
}

async function sendBLE(cmd) {
  if (!bleCmdChar) { showToast('Not connected'); return; }
  try {
    await bleCmdChar.writeValueWithoutResponse(new TextEncoder().encode(cmd));
  } catch (err) {
    console.error('[BLE] Send error:', err);
    showToast('Send failed');
  }
}

// === WebSocket ===
function connectWS() {
  const host = document.getElementById('wsHost').value || window.location.hostname || 'localhost';
  try {
    setConnStatus('connecting', 'Connecting...');
    ws = new WebSocket(`ws://${host}:${WS_PORT}/`);
    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'register', client: 'tablet' }));
      setConnStatus('connected', `WiFi: ${host}`);
      showToast('Connected via WiFi');
    };
    ws.onmessage = (event) => {
      try {
        const msg = JSON.parse(event.data);
        if (msg.type === 'display_state') updateExaminerDisplay(msg);
      } catch(e) {}
    };
    ws.onclose = () => { setConnStatus('', 'Disconnected'); ws = null; };
    ws.onerror = () => { setConnStatus('', 'Connection failed'); ws = null; showToast('WiFi connection failed'); };
  } catch (err) { setConnStatus('', 'Disconnected'); showToast('Connection error'); }
}

function disconnectWS() { if (ws) { ws.close(); ws = null; } setConnStatus('', 'Disconnected'); }

function sendWS(cmd) {
  if (!ws || ws.readyState !== WebSocket.OPEN) { showToast('Not connected'); return; }
  ws.send(JSON.stringify({ cmd, timestamp: Date.now() }));
}

// === Mode ===
function setMode(m) {
  mode = m;
  document.getElementById('btnModeBLE').className = 'cmd-btn' + (m === 'ble' ? ' accent' : '');
  document.getElementById('btnModeWS').className = 'cmd-btn' + (m === 'ws' ? ' accent' : '');
  disconnectBLE(); disconnectWS();
  showToast(m === 'ble' ? 'Bluetooth mode' : 'WiFi mode');
}

function toggleConnection() {
  connected ? (mode === 'ble' ? disconnectBLE() : disconnectWS()) : (mode === 'ble' ? connectBLE() : connectWS());
}

// === Examiner Display ===
function updateExaminerDisplay(state) {
  if (state.test) document.getElementById('examTestName').textContent = state.test.replace(/_/g, ' ').toUpperCase();
  if (state.acuity) document.getElementById('examAcuity').textContent = state.acuity;
  if (state.letters) {
    const el = document.getElementById('examLetters');
    el.innerHTML = '';
    const span = document.createElement('span');
    span.textContent = state.letters;
    el.appendChild(span);
  }
  if (state.mode) document.getElementById('examMode').textContent = state.mode;
  if (state.row !== undefined) document.getElementById('examRow').textContent = 'Row ' + (state.row + 1);
}

// === Force Update ===
function forceUpdate() {
  const status = document.getElementById('updateStatus');
  status.textContent = 'Checking...';
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistration().then(reg => {
      const clearAndReload = () => {
        caches.keys().then(keys => {
          Promise.all(keys.map(k => caches.delete(k))).then(() => {
            status.textContent = 'Updated! Reloading...';
            setTimeout(() => location.reload(true), 500);
          });
        });
      };
      if (reg) reg.unregister().then(clearAndReload);
      else clearAndReload();
    });
  } else {
    setTimeout(() => location.reload(true), 500);
  }
}

// === Init ===
setMode('ble');

// === INFO long-press: hold to keep zoomed, release → 3s timer ===
const btnInfo = document.getElementById('btnInfo');
let infoHoldInterval = null;
btnInfo.addEventListener('touchstart', (e) => {
  e.preventDefault();
  sendCommand('INFO');
  infoHoldInterval = setInterval(() => sendCommand('INFO'), 500);
}, { passive: false });
btnInfo.addEventListener('touchend', () => {
  clearInterval(infoHoldInterval);
  infoHoldInterval = null;
});
btnInfo.addEventListener('touchcancel', () => {
  clearInterval(infoHoldInterval);
  infoHoldInterval = null;
});

// === Service Worker ===
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(() => {}).catch(e => console.warn('[SW]', e));
}
</script>

</body>
</html>
